on: 
  push:
    branches:
    - 'master'
    - 'chameleoncloud/**'
  pull_request:

# don't run duplicate jobs, e.g. pr or force push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
      runs-on: ubuntu-22.04
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-python@v6
          with:
            python-version: '3.10'
        - run: pip install tox
        - run: tox -e py
